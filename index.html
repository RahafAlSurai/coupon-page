<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coupon</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #f9f9f9, #e8ffe8);
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .card {
      background: white;
      padding: 50px 70px;
      border-radius: 24px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.15);
    }

    h1 {
      font-size: 64px;
      color: #27ae60;
      margin: 0;
    }

    p {
      font-size: 22px;
      color: #555;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>I got you 🎉</h1>
    <p></p>
  </div>
</body>
</html>
